# Non-maintainer PRs that touch the engine or its tests must attest a real
# RTX 5090 run — CI has no GPU, all but two test files need one, so the ticked
# box in the PR template is the only signal that `make test-remote` was run at
# all. Adapted from sparkinfer's rtx5090-required gate with one softening:
# sparkinfer auto-closes (it fields a flood of miner PRs); braid fails this
# check and comments instead — same information, reversible by editing the PR
# description, and there is no flood to manage here.
#
# Safe by design: pull_request_target always runs THIS file from main, and the
# job only reads PR metadata over the API — PR code is never checked out or
# executed, so the elevated token is safe. Maintainers, bots, drafts, and PRs
# labelled `hold` are exempt.
name: pr-gate

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Require the RTX 5090 attestation on engine/tests PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const MARKER = '<!-- braid-pr-gate -->';

            const EXEMPT_ASSOC = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            if (pr.draft || pr.user?.type === 'Bot' ||
                EXEMPT_ASSOC.has(pr.author_association) ||
                (pr.labels || []).some(l => l.name === 'hold')) {
              core.info('exempt — gate not applied');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const runtime = files.some(f =>
              f.filename.startsWith('braid/') || f.filename.startsWith('tests/'));
            if (!runtime) {
              core.info('no engine/tests paths touched — gate not applied');
              return;
            }

            // Same convention as sparkinfer: the attestation is a ticked
            // checkbox on a line mentioning 5090.
            const ticked = (pr.body || '').split('\n').some(ln =>
              ln.includes('5090') && /-\s*\[\s*[xX]\s*\]/.test(ln));

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const mine = comments.find(c => c.body?.includes(MARKER));

            if (ticked) {
              if (mine) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: mine.id,
                  body: MARKER + '\nRTX 5090 attestation found — gate satisfied.',
                });
              }
              core.info('gate satisfied');
              return;
            }

            const body = MARKER + '\n' +
              '## Gate: no RTX 5090 attestation\n\n' +
              'This PR touches `braid/` or `tests/`, but the **Tested on RTX 5090** box ' +
              'in the description is not ticked. CI has no GPU — all but two test files ' +
              'need a real RTX 5090 (`make test-remote`), so the ticked box is the only ' +
              'signal the suite was run at all.\n\n' +
              'To clear this check:\n\n' +
              '1. Run the suite on an RTX 5090: `make test-remote`\n' +
              '2. If the PR claims a speedup, fill the before/after table with real ' +
              '`make bench-scaling` numbers\n' +
              '3. Edit the PR description and tick `- [x] Tested on RTX 5090`\n\n' +
              'Tick the box only after a real run.\n\n' +
              '<sub>Automated gate; maintainers, drafts, and `hold`-labelled PRs are ' +
              'exempt.</sub>';
            if (mine) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body,
              });
            }
            core.setFailed('RTX 5090 attestation missing on an engine/tests PR');
